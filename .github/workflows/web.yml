name: build web

# Gera o build Web do Godot e publica no GitHub Pages.
# Depois do primeiro deploy, o jogo abre no Safari do iPhone pelo endereco:
#   https://<usuario>.github.io/<repositorio>/
#
# Pre-requisito (uma vez, no GitHub): Settings > Pages > Source = "GitHub Actions".
# Nao foi executado nenhuma vez: se falhar, veja o log do job "build".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1-stable

jobs:
  build:
    name: Exportar Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot e dos modelos de exportacao
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-templates

      - name: Instalar Godot e modelos
        run: |
          set -euo pipefail
          if [ ! -x /opt/godot/godot ]; then
            sudo mkdir -p /opt/godot
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            sudo unzip -q -o /tmp/godot.zip -d /opt/godot
            sudo mv "/opt/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /opt/godot/godot
            sudo chmod +x /opt/godot/godot
          fi
          if [ ! -d "$HOME/.local/share/godot/export_templates/4.4.1.stable" ]; then
            curl -fsSL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            mkdir -p "$HOME/.local/share/godot/export_templates"
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl
            mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          fi
          /opt/godot/godot --version

      - name: Importar e exportar
        run: |
          set -euo pipefail
          mkdir -p build/web
          /opt/godot/godot --headless --path . --import || true
          /opt/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          ls -la build/web

      - name: Desativar Jekyll
        run: touch build/web/.nojekyll

      # Diagnostico (B-25/B-27): injeta no jogo um painel que mostra tudo que
      # o Godot imprime no console (erros de script, shader e runtime) —
      # o console do Safari no iPhone nao e visivel. Remover quando a
      # Fase 1.5 estiver validada.
      # Canto inferior CENTRAL e estreito de proposito: na esquerda ficava em
      # cima do joystick; na direita cobria PULAR/CORRER/ENTRAR.
      - name: Injetar console visivel no build Web
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/web/index.html")
          html = p.read_text()
          shim = """<script>
          (function () {
            // B-73: no Safari do iPhone a pagina ficava mais alta que a area
            // VISIVEL (100% do body inclui a area atras da barra de endereco),
            // e as bordas do canvas eram cortadas: a primeira fileira de botoes
            // do HUD e o titulo sumiam no topo, o console era cortado embaixo.
            // 100dvh acompanha a barra do Safari; se o navegador nao conhecer a
            // unidade, o CSS e ignorado e vale o 100% do template.
            var st = document.createElement('style');
            st.textContent = 'html,body{height:100dvh;overflow:hidden}#canvas{display:block}';
            document.head.appendChild(st);
            var box = document.createElement('pre');
            box.style.cssText = 'position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:38vw;max-height:12vh;overflow:auto;margin:0;padding:3px;background:rgba(0,0,0,.72);color:#7dff7d;font:9px/1.3 monospace;z-index:99999;white-space:pre-wrap;pointer-events:none;';
            document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(box); });
            ['log', 'warn', 'error'].forEach(function (k) {
              var orig = console[k].bind(console);
              console[k] = function () {
                var t = '[' + k + '] ';
                for (var i = 0; i < arguments.length; i++) t += String(arguments[i]) + ' ';
                // Ruido do carregador do proprio Godot, em vermelho, que nao e
                // erro do jogo: tira da tela para nao assustar quem joga.
                if (t.indexOf('run dependencies') >= 0 || t.indexOf('dependency:') >= 0) {
                  orig.apply(null, arguments);
                  return;
                }
                box.textContent += t + '\\n';
                box.scrollTop = box.scrollHeight;
                orig.apply(null, arguments);
              };
            });
          })();
          </script>"""
          if "</body>" in html:
              html = html.replace("</body>", shim + "</body>", 1)
          else:
              html += shim
          p.write_text(html)
          print("console shim injetado em build/web/index.html")
          PY

      # Reserva: mesmo que a publicacao falhe, o build fica baixavel no artifact.
      - name: Guardar o build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: carioca-web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
